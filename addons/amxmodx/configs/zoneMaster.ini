#==============================================#
  # Zone Master by RedSMURF: Configuration file #
#==============================================#

# To add a new zone, follow the example below
# [Zone Name]
# MASTER_FLAGS                    = a - Icon,           b - Active Delay           c - Active Duration
# MASTER_TEAM                     = 0 - Disabled        1 - Terrorist Only         2 - CT Only            3 - Both Teams
# MASTER_ANIM                     = 0 - Idle            1 - Spin                   2 - Float              3 - Spin-Float
# MASTER_ACTIVE_CHANCE            = Chance the zone is active when checked (0.0 - 1.0)
# MASTER_ACTIVE_DELAY             = Delay before the zone activates
# MASTER_ACTIVE_DURATION          = Duration the zone stays active
# MASTER_ACTIVE_COOLDOWN          = Cooldown before the zone can reactivate
# MASTER_ICON_SCALE               = Scale of the floating icon model
# MASTER_ICON_ALPHA               = Alpha of the floating icon model (0 - 255)
# MASTER_ICON                     = Path of zone's icon model
# MASTER_CLASS                    = Used to allocate extra data per zone:
#                                 0 = Ammo
#                                 1 = Bomb
#                                 2 = Clock
#                                 3 = Health
#                                 4 = Lightning
#                                 5 = Mask
#                                 6 = Mask2
#                                 7 = Shield
#                                 8 = Skull
#                                 9 = Skull2
#                                 10 = Stun
#                                 11 = Stun2
#                                 12 = Up
#                                 13 = Wings

# --- CLASS_AMMO:
# AMMO_FREQ                 = Minimum - Maximum Frequency of ammo refill while inside the zone
# AMMO_CLIP                 = Minimum - Maximum Amount of ammo added to the current weapon's clip
# AMMO_AMMO                 = Minimum - Maximum Amount of ammo added to the weapon's backpack
# AMMO_MODE                 = 0 - Relative to the max  1 - Absolute value
# AMMO_OVERFLOW             = If true, allows ammo to exceed the weapon's normal max capacity

# --- CLASS_BOMB:
# BOMB_FREQ                 = Minimum - Maximum Frequency of grenade resupply while inside the zone
# BOMB_HE_SUPPLY            = Minimum - Maximum Amount of HE grenades given per tick
# BOMB_FB_SUPPLY            = Minimum - Maximum Amount of Flashbangs given per tick
# BOMB_SMOKE_SUPPLY         = Minimum - Maximum Amount of Smoke grenades given per tick
# BOMB_HE_LIMIT             = Maximum HE grenades the player can hold
# BOMB_FB_LIMIT             = Maximum Flashbangs the player can hold
# BOMB_SMOKE_LIMIT          = Maximum Smoke grenades the player can hold
# BOMB_OVERFLOW             = If true, allows grenade counts to exceed the normal maximum

# --- CLASS_CLOCK:
# CLOCK_RELOAD_SPEED        = Minimum - Maximum weapon reload speed multiplier while inside the zone
# CLOCK_ATTACK_SPEED        = Minimum - Maximum weapon attack speed multiplier while inside the zone
# CLOCK_DEPLOY_SPEED        = Minimum - Maximum weapon deploy speed multiplier while inside the zone
# CLOCK_RECOIL_SETTING      = Minimum - Maximum Weapon recoil reduction while inside the zone

# --- CLASS_HEALTH:
# HEALTH_FREQ               = Minimum - Maximum frequency of healing while inside the zone
# HEALTH_RATE               = Minimum - Maximum amount of health restored per tick
# HEALTH_LIMIT              = Maximum health the player can reach inside the zone
# HEALTH_OVERFLOW           = If true, allows health to exceed the normal maximum

# --- CLASS_LIGHTNING:
# LIGHTNING_SPEED           = Minimum - Maximum speed value to set while inside the zone

# --- CLASS_MASK:
# MASK_ALPHA                = Minimum - Maximum Player alpha (transparency) while inside the zone
# MASK_FOOTSTEP             = If true, footsteps are silenced while inside

# --- CLASS_MASK2:
# MASK2_MODEL_FLAG          = a - First model,  b - Second model,  c - Third model,  d - Forth model

# --- CLASS_SHIELD:
# SHIELD_ARMOR_FREQ         = Minimum - Maximum frequency of armor resupply while inside the zone
# SHIELD_ARMOR              = Minimum - Maximum amount of armor added per tick
# SHIELD_ARMOR_LIMIT        = Maximum armor the player can have
# SHIELD_ARMOR_OVERFLOW     = If true, allows armor to exceed the normal max
# SHIELD_ARMOR_TYPE         = 1 - Kevlar,    2 - Vesthelm
# SHIELD_ABSORB             = Minimum - Maximum fraction of incoming damage absorbed while inside
# SHIELD_REFLECT            = Minimum - Maximum fraction of damage reflected to attackers while inside

# --- CLASS_SKULL:
# SKULL_DAMAGE              = Minimum - Maximum damage dealt to the player per tick
# SKULL_BLOOD               = Minimum - Maximum fraction of life stolen from targets while inside

# --- CLASS_SKULL2:
# SKULL2_FREQ               = Minimum - Maximum frequency of the periodic effect while inside the zone
# SKULL2_DAMAGE             = Minimum - Maximum damage dealt to the player per tick
# SKULL2_DAMAGE_TYPE        = Damage type for the skull
# SKULL2_LIMIT              = Maximum damage the player can take inside the zone
# SKULL2_OVERFLOW           = If true, allows damage to exceed the normal maximum

# --- CLASS_STUN:
# STUN_FREQ                 = Minimum - Maximum frequency of screen shake and flash while inside the zone
# STUN_AMPLITUDE            = Magnitude of screen shake while inside
# STUN_FREQUENCY            = Frequency of screen shake while inside
# STUN_COLOR_MIN            = Minimum RGBA color of the screen flash while inside
# STUN_COLOR_MAX            = Maximum RGBA color of the screen flash while inside
# STUN_FOV                  = FOV change while inside the zone

# --- CLASS_STUN2:
# STUN2_FREQ                = Minimum - Maximum Time between consecutive slaps while inside
# STUN2_DAMAGE              = Minimum - Maximum damage per slap
# STUN2_DIRECTION           = 0 - Forward,   1 - Random
# STUN2_KILL                = If true, slaps can kill the player

# --- CLASS_UP:
# UP_JUMP                   = Minimum - Maximum upward push applied per tick while inside
# UP_GRAVITY                = Minimum - Maximum gravity multiplier applied while inside the zone

# --- CLASS_WINGS:
# WINGS_NOCLIP              = If true, player's noclip is enabled while inside the zone
# WINGS_GODMODE             = If true, player's godmode is enabled while inside the zone

# To make a zone available in the menu, you must defined at least it's name like this [Zone Name]
# When creating a new zone, first define the common properties such as icon and flags.
# Then, set the zone's class, and then specify any extra properties associated with that class.

